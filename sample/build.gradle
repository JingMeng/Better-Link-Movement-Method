apply plugin: 'com.android.application'

repositories {
  google()
  mavenCentral()
}

android {
  namespace 'me.saket.bettermovementmethod.sample'
  compileSdkVersion versions.compileSdk

  defaultConfig {
    applicationId 'me.saket.betterlinkmovement.sample'
    minSdk 23
    targetSdkVersion versions.targetSdk
    versionCode versions.libraryVersionCode
    versionName versions.libraryVersionName
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    targetCompatibility JavaVersion.VERSION_11
    sourceCompatibility JavaVersion.VERSION_11
  }

  productFlavors {
  }
}

dependencies {
  implementation project(path: ':better-link-movement-method')
}

